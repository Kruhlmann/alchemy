[package]
name = "alchemy-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "alchemy"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
datatest-stable = "0.3"

[[test]]
name = "cases"
path = "tests/cases.rs"
harness = false
